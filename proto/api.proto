syntax = "proto3";

package game.v1;

option go_package = "github.com/gamedev/f1/pkg/pb;pb";

import "player.proto";

// ------------------------- 登录 / 会话 -------------------------

message LoginReq {
  uint64 uid     = 1;
  string token   = 2;
  string gate_id = 3;
  uint64 conn_id = 4;

  // 渠道登录：填 channel + credential，uid 和 token 留空，网关转给账号服务换。
  // 重连时客户端应当带上次拿到的 token 走 uid+token 这条路，不要再打一次渠道
  string channel    = 5;
  string credential = 6;
  string device_id  = 7;
}

// ------------------------- 账号（Account） -------------------------

// AuthChannelReq 拿渠道凭证换我们自己的 token
message AuthChannelReq {
  string channel    = 1;
  string credential = 2;
  string device_id  = 3;
}

message AuthChannelResp {
  uint64 uid         = 1;
  string token       = 2;
  int64  expires_at  = 3;   // 毫秒
  bool   first_login = 4;   // 这次登录顺带开的号
  string open_id     = 5;
}

// BindChannelReq 给已登录的 uid 再绑一个渠道
message BindChannelReq {
  string channel    = 1;
  string credential = 2;
}

message BindChannelResp {
  repeated Binding bindings = 1;
}

message UnbindChannelReq {
  string channel = 1;
}

message UnbindChannelResp {
  repeated Binding bindings = 1;
}

message ListBindingsReq {}

message ListBindingsResp {
  repeated Binding bindings = 1;
}

message Binding {
  string channel  = 1;
  string open_id  = 2;
  int64  bound_at = 3;   // 毫秒
}

message LoginResp {
  PlayerBase base   = 1;
  PlayerBag  bag    = 2;
  PlayerQuest quest = 3;
  bool   reconnect  = 4;
  // open_round 非空表示有没打完的回合，客户端要先把它打完。
  Round  open_round = 5;
}

message LogoutReq {
  uint64 uid  = 1;
  string gate_id = 2;
  uint64 conn_id = 3;
  uint32 reason  = 4;   // 0 主动 1 断线 2 顶号
}

// 顶号下发（push.gate.{gateID}）
message KickNotify {
  uint64 uid     = 1;
  uint64 conn_id = 2;
  uint32 reason  = 3;
  string message = 4;
}

// ------------------------- 玩家逻辑 -------------------------

message HeartbeatReq { int64 client_ts = 1; }
message HeartbeatResp { int64 server_ts = 1; }

message AddCurrencyReq {
  uint32 currency = 1;
  int64  delta    = 2;
  string reason   = 3;
}
message AddCurrencyResp { int64 balance = 1; }

message AddItemReq {
  uint32 tpl_id = 1;
  int64  count  = 2;
  string reason = 3;
}
message AddItemResp { Item item = 1; }

message UseItemReq {
  uint64 instance_id = 1;
  int64  count       = 2;
}
message UseItemResp { int64 remain = 1; }

message GetBagReq {}
message GetBagResp { PlayerBag bag = 1; }

message AcceptQuestReq { uint32 quest_id = 1; }
message QuestProgressReq { uint32 quest_id = 1; int64 delta = 2; }
message QuestResp { Quest quest = 1; }

message GetProfileReq { repeated uint64 uids = 1; }
message GetProfileResp { repeated Profile profiles = 1; }

message AddFriendReq { uint64 target = 1; }
message GetSocialReq {}
message GetSocialResp { PlayerSocial social = 1; }

message GetMailReq {}
message GetMailResp { PlayerMail mail = 1; }
message ClaimMailReq { uint64 mail_id = 1; }
message ClaimMailResp { repeated Item items = 1; }

// 充值。订单号保证幂等，回执签名防伪造，两个都要。
message PurchaseReq {
  string order_id = 1;   // 客户端唯一订单号
  uint32 product  = 2;
  reserved 3;            // 原 amount。到账数量只能来自服务端配置
  reserved "amount";
  PurchaseReceipt receipt = 4;
}
message PurchaseResp {
  int64 balance   = 1;
  bool  duplicate = 2;   // true 表示返回的是首次结果
}

// ------------------------- 房间 / 战斗 -------------------------

message CreateRoomReq {
  uint32 mode = 1;
  uint32 max_player = 2;
  repeated uint64 members = 3;
  // room_id 由调用方用雪花生成。房间分片由它决定，调用方得先有 ID 才能选对 subject。
  uint64 room_id = 4;
}
message CreateRoomResp { uint64 room_id = 1; }

message JoinRoomReq { uint64 room_id = 1; uint64 uid = 2; }
message LeaveRoomReq { uint64 room_id = 1; uint64 uid = 2; }

message RoomOpReq {
  uint64 room_id = 1;
  uint64 uid     = 2;
  uint32 op      = 3;
  bytes  payload = 4;
}

message RoomSnapshot {
  uint64 room_id = 1;
  uint32 mode    = 2;
  uint32 state   = 3;   // 0 等待 1 战斗中 2 结算
  repeated uint64 members = 4;
  int64  created_at = 5;
  int64  started_at = 6;
  uint32 frame = 7;
}

message RoomBroadcast {
  uint64 room_id = 1;
  uint32 cmd     = 2;
  bytes  payload = 3;
}

// 网关聚合推送，一条消息带多个 uid
message MultiPush {
  repeated uint64 uids = 1;
  uint32 cmd = 2;
  bytes  payload = 3;
}

message BattleResult {
  uint64 room_id = 1;
  uint64 target_uid = 5;  // job 投递时指明给谁结算
  repeated uint64 winners = 2;
  repeated uint64 losers  = 3;
  map<uint64, int64> score = 4;
}

// ------------------------- 匹配 -------------------------

message MatchEnqueueReq {
  uint64 uid  = 1;
  uint32 mode = 2;
  uint32 tier = 3;
  uint64 power = 4;
}
message MatchCancelReq { uint64 uid = 1; uint32 mode = 2; uint32 tier = 3; }
message MatchAck { bool queued = 1; int32 position = 2; }

message MatchFound {
  uint64 room_id = 1;
  uint32 mode    = 2;
  repeated uint64 members = 3;
}

// ------------------------- 聊天 -------------------------

message ChatReq {
  uint32 channel = 1;   // 1 世界 2 公会 3 私聊 4 房间
  uint64 from    = 2;
  uint64 to      = 3;
  uint64 guild_id = 4;
  uint64 room_id  = 5;
  string text    = 6;
}
message ChatMsg {
  uint32 channel = 1;
  uint64 from    = 2;
  string from_nick = 3;
  string text    = 4;
  int64  ts_ms   = 5;
}

// ------------------------- 跨分片转移 -------------------------

message TransferJob {
  string txid = 1;
  uint64 from_uid = 2;
  uint64 to_uid   = 3;
  repeated Attachment items = 4;
  int64  currency_delta = 5;
  uint32 currency_type  = 6;
  string reason = 7;
  int64  created_at = 8;
}

message MailSendJob {
  uint64 to_uid = 1;
  Mail   mail   = 2;
  string txid   = 3;
}

// ------------------------- 控制面 -------------------------

message HandoffReq {
  string kind      = 1;   // "lobby" / "room"
  uint32 shard     = 2;
  string from_node = 3;
  string to_node   = 4;
}
message HandoffResp {
  bool   ready  = 1;
  string reason = 2;
}

message ShutdownReq { string reason = 1; }

// ------------------------- 世界 -------------------------

message WorldBossState {
  uint64 boss_id = 1;
  int64  hp      = 2;
  int64  max_hp  = 3;
  int64  started_at = 4;
  bool   alive   = 5;
}
message WorldBossHitReq { uint64 uid = 1; int64 damage = 2; }
message WorldBossHitResp { int64 hp_left = 1; bool killed = 2; }

// ---------------------------------------------------------------------------
// slots
// ---------------------------------------------------------------------------

// Round 是一次游戏回合，从下注到结算。
//
// 免费旋转期间保持 OPEN。玩家断线重连后要能取回来接着打完。
message Round {
  uint64 round_id         = 1;
  string game_id          = 2;
  string config_version   = 3;  // 结算用的配置版本，复算要
  string seed_hex         = 4;  // RNG 种子，复算要
  uint32 currency         = 5;
  int64  bet              = 6;  // 单次旋转的总投注
  int64  total_win        = 7;  // 本回合累计派彩
  uint32 spin_index       = 8;  // 已经转了几次，复算时要重放到这一步
  uint32 free_spins_left  = 9;
  uint32 free_spins_total = 10;
  uint32 multiplier       = 11;
  uint32 state            = 12; // 0 未结算 1 已结算
  int64  created_at       = 13;
  int64  settled_at       = 14;
}

message SpinReq {
  string game_id  = 1;
  int64  bet      = 2;   // 免费旋转时忽略，用回合里那个
  uint32 currency = 3;
  string client_id = 4;  // 客户端幂等号，重发同一次 spin 不能重复扣费
}

message LineWin {
  uint32 line    = 1;
  uint32 symbol  = 2;
  uint32 count   = 3;
  int64  payout  = 4;
}

message SpinResp {
  Round  round        = 1;
  repeated uint32 grid = 2;   // 按列展开：reel0 各行、reel1 各行……
  repeated uint32 stops = 3;  // 各轴停位，复算时对照
  repeated LineWin lines = 4;
  uint32 scatter_count  = 5;
  int64  spin_win       = 6;  // 本次派彩，已含倍数
  int64  balance        = 7;
  uint32 free_spins_awarded = 8;
  bool   round_finished = 9;
  int64  jackpot_win    = 10; // 非 0 表示中奖池了
  bool   duplicate      = 11; // 重发的 spin，返回的是第一次的结果
}

message RoundStateReq {}
message RoundStateResp {
  Round round    = 1;
  bool  has_open = 2;
}

// ---------------------------------------------------------------------------
// 抽卡
// ---------------------------------------------------------------------------

message GachaReq {
  string pool_id  = 1;
  uint32 times    = 2;  // 1 或 10
  string client_id = 3;
}

message GachaDrop {
  uint32 tpl_id   = 1;
  uint32 rarity   = 2;
  int64  count    = 3;
  bool   by_pity  = 4;  // 是不是保底给的
}

message GachaResp {
  repeated GachaDrop drops = 1;
  uint32 pity_counter = 2;  // 离下次保底还差几抽
  int64  balance      = 3;
  bool   duplicate    = 4;
}

// ---------------------------------------------------------------------------
// 奖池
// ---------------------------------------------------------------------------

message JackpotInfoReq { string pool_id = 1; }
message JackpotInfoResp {
  string pool_id = 1;
  int64  amount  = 2;
  int64  seed    = 3;  // 底注，清零后回到这个值
}

message JackpotClaimReq {
  string pool_id  = 1;
  uint64 uid      = 2;
  string txid     = 3;
  int64  amount   = 4;
  uint64 round_id = 5;
}
message JackpotClaimResp {
  int64  amount = 1;
  bool   won    = 2;
}

// ---------------------------------------------------------------------------
// 责任游戏（Responsible Gaming）
// ---------------------------------------------------------------------------

message RGStatusReq {}
message RGStatusResp {
  int64 daily_bet        = 1;
  int64 daily_bet_limit  = 2;
  int64 daily_loss       = 3;
  int64 daily_loss_limit = 4;
  int64 session_seconds  = 5;
  int64 session_limit    = 6;
  int64 excluded_until   = 7;
  bool  blocked          = 8;
  string reason          = 9;
}

message GMSetRGReq {
  uint64 uid              = 1;
  int64  daily_bet_limit  = 2;
  int64  daily_loss_limit = 3;
  int64  session_limit    = 4;
  int64  exclude_until    = 5;
}

// ---------------------------------------------------------------------------
// 充值 / GM
// ---------------------------------------------------------------------------

message PurchaseReceipt {
  string channel   = 1;  // 支付渠道
  string receipt   = 2;  // 渠道回执 / 票据
  string signature = 3;  // 渠道签名
}

message GMGrantReq {
  uint64 uid      = 1;
  uint32 currency = 2;
  int64  amount   = 3;
  repeated Attachment items = 4;
  string reason   = 5;
  string ticket   = 6;  // 工单号，兼作幂等键
}

message GMQueryReq {
  uint64 uid   = 1;
  int32  limit = 2;  // 返回最近几条流水
}

message LedgerEntry {
  string entry_id  = 1;
  uint64 uid       = 2;
  string type      = 3;
  uint32 currency  = 4;
  int64  amount    = 5;  // 正入负出
  int64  balance   = 6;  // 变动后余额
  uint64 round_id  = 7;
  string game_id   = 8;
  string ref       = 9;
  int64  ts_ms     = 10;
  string config_version = 11;
}

message GMQueryResp {
  PlayerBase base = 1;
  repeated LedgerEntry entries = 2;
  Round open_round = 3;
}
